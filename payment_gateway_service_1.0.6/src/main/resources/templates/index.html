<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Treasurex Subscription</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Custom CSS -->
	<link th:href="@{/css/index.css}" rel="stylesheet">
</head>


<body>

	<!-- Loader -->
	<div id="loadingOverlay">
		<div class="text-center">
			<div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
			<p class="mt-2 fw-bold text-primary">Loading...</p>
		</div>
	</div>

	<div class="box">
		<h1>Treasurex Subscription</h1>

		<div class="mb-3">
			<label for="email" class="form-label">Email Address</label>
			<input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
		</div>

		<div class="mb-3">
			<label for="subscriptionType" class="form-label">Subscription Type</label>
			<select class="form-select" id="subscriptionType" name="subscriptionType" required>
				<option value="">Select Plan</option>
				<option value="BASIC">Basic</option>
				<option value="SILVER">Silver</option>
				<option value="GOLD">Gold</option>
				<option value="PLATINUM">Platinum</option>
				<option value="PRIME">Prime</option>
			</select>
		</div>

		<div class="mb-3">
			<label for="amount" class="form-label">Amount (₹)</label>
			<input type="number" class="form-control" id="amount" name="amount" placeholder="Enter amount" readonly>
		</div>

		<button class="btn btn-primary" id="proceedToPayBtn" onclick="proceedToPayBtn()">Proceed to Pay</button>
		<br>

		<div id="error_msg"></div>
	</div>

	<!-- Razorpay JS -->
	<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

	<!-- Bootstrap JS Bundle -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
		</script>

	<script th:src="@{/js/common.js}"></script>
	<script th:src="@{/js/mainlogic.js}"></script>


</body>

</html>
